name: thaheen
description: "Thaheen - Mini Offline LMS with Video Player"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Video Player
  video_player: ^2.9.3
  chewie: ^1.11.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^14.8.1

  # Fonts
  google_fonts: ^6.2.1
  lottie:

  # SVG support
  flutter_svg: ^2.0.16
  better_player_plus: 1.1.5
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/png/
    - assets/videos/
    - assets/lotties/
